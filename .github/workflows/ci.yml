name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  vertical-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Select Playwright Chromium
        run: node --input-type=module -e 'import { chromium } from "playwright"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "ZC_CHROMIUM_PATH=" + chromium.executablePath() + "\n");'
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm audit --prod
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-slice-evidence
          path: test-results/
